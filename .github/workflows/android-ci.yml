name: Android CI

# Run on every push to any branch, and on every Pull Request
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 11 (matches compileOptions in build.gradle.kts)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      # 3. Restore google-services.json from the GitHub Secret
      #    Go to: GitHub repo → Settings → Secrets and variables → Actions
      #    Create a secret named GOOGLE_SERVICES_JSON with the full content of app/google-services.json
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # 4. Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Run all unit tests
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 6. Upload test reports as a downloadable artifact
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/



